+'<div class="card"><h3>Upcoming tests</h3>'+(up.length?up.map(p=>'<div class="ul"><span><b>'+esc(p.sub)+'</b> '+esc(p.title)+'</span><span class="mut">'+p.date+' · '+rel(p.date)+'</span></div>').join(''):'<p class="mut">No tests yet. Add a fixed test date with the form below.</p>')+'</div>'
+'<div class="card"><details class="f"><summary>Add a test or revision with the form</summary><div class="row"><select id="pt"><option value="test">Test / exam</option><option value="rev">Revision session</option></select><select id="ps">'+subOpts('')+'</select></div>'

const mAt=y=>{const t=$('#cb .col').getBoundingClientRect().top;return Math.max(H0*60,Math.min(H1*60,Math.round(((y-t)/PX+H0)*2)/2*60))};
const colAt=x=>[...document.querySelectorAll('#cb .col')].find(c=>{const r=c.getBoundingClientRect();return x>=r.left&&x<r.right});
const place=(el,s,e)=>{el.style.top=(s/60-H0)*PX+'px';el.style.height=(e-s)/60*PX+'px'};
function calInit(){const c=$('#cb');if(!c)return;c.onpointerdown=e=>{if(e.button>0)return;const col=e.target.closest('.col');if(!col)return;e.preventDefault();
const rz=e.target.closest('.rz'),el=e.target.closest('.ev'),p=el&&S.plan.find(x=>x.id===el.dataset.id),m0=mAt(e.clientY);
drag={mode:rz?'rz':el?'mv':'new',p,el,x0:e.clientX,y0:e.clientY,m0,moved:false,d:p?p.date:col.dataset.d,s:p?p.start:m0,e:p?p.end:m0+30};
if(!el){const g=document.createElement('div');g.className='ev ty-rev gh';place(g,Math.min(m0,H1*60-30),Math.min(m0+30,H1*60));col.appendChild(g);drag.el=g}
window.addEventListener('pointermove',dmove);window.addEventListener('pointerup',dup);window.addEventListener('pointercancel',dcancel)}}
function dmove(e){const D=drag;if(!D)return;if(Math.abs(e.clientY-D.y0)+Math.abs(e.clientX-D.x0)>4)D.moved=true;if(!D.moved)return;
const m=mAt(e.clientY),dd=m-D.m0,hi=H1*60;
if(D.mode==='new'){D.s=Math.min(m>=D.m0?D.m0:m,hi-30);D.e=Math.min(m>=D.m0?Math.max(m,D.m0+30):D.m0,hi);place(D.el,D.s,D.e)}
else if(D.mode==='mv'){const dur=D.p.end-D.p.start,c=colAt(e.clientX);D.s=Math.max(H0*60,Math.min(hi-dur,D.p.start+dd));D.e=D.s+dur;if(c){D.d=c.dataset.d;if(D.el.parentNode!==c)c.appendChild(D.el)}place(D.el,D.s,D.e)}
else{D.s=D.p.start;D.e=Math.max(D.s+30,Math.min(hi,D.p.end+dd));place(D.el,D.s,D.e)}}
function unbind(){window.removeEventListener('pointermove',dmove);window.removeEventListener('pointerup',dup);window.removeEventListener('pointercancel',dcancel)}
function dup(){unbind();const D=drag;drag=null;if(!D)return;
if(D.mode==='new'){D.el.remove();if(!D.moved){D.s=Math.min(D.m0,H1*60-30);D.e=Math.min(H1*60,D.s+60)}const id=uid();S.plan.push({id,type:'rev',sub:'',title:'Revision',date:D.d,start:D.s,end:D.e,done:false});sel=id}
else if(!D.moved)sel=D.p.id===sel?null:D.p.id;
else{D.p.start=D.s;D.p.end=D.e;D.p.date=D.d;sel=D.p.id}
commit()}
function dcancel(){unbind();if(drag&&drag.mode==='new')drag.el.remove();drag=null;render()}
